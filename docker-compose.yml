services:
  postgres:
    image: postgres:16
    container_name: lean-poizon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lean_poizon
    ports:
      - "5432:5432"
    volumes:
      - lean-poizon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lean_poizon"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lean-poizon-postgres-data:
